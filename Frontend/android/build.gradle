// Top-level build file where you can add configuration options common to all sub-projects/modules.

def resolveNodePath(String expression) {
    def standardOutput = new ByteArrayOutputStream()
    def errorOutput = new ByteArrayOutputStream()
    def process = ["node", "--print", expression].execute(null, rootDir)
    process.waitForProcessOutput(standardOutput, errorOutput)

    if (process.exitValue() != 0) {
        throw new GradleException(errorOutput.toString("UTF-8").trim())
    }

    return standardOutput.toString("UTF-8").trim()
}

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '23')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '34')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.23'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(resolveNodePath("require.resolve('react-native/package.json')"), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(resolveNodePath("require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven { url("$rootDir/../node_modules/expo-camera/android/maven") }
    }
}
