pluginManagement {
  def resolveNodePathUtf8 = { String expression ->
    def standardOutput = new ByteArrayOutputStream()
    def errorOutput = new ByteArrayOutputStream()
    def process = ["node", "--print", expression].execute(null, rootDir)
    process.waitForProcessOutput(standardOutput, errorOutput)

    if (process.exitValue() != 0) {
      throw new GradleException(errorOutput.toString("UTF-8").trim())
    }

    return standardOutput.toString("UTF-8").trim()
  }

  def version = providers.exec {
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()
  def (_, reactNativeMinor, reactNativePatch) = version.split("-")[0].tokenize('.').collect { it.toInteger() }
  def reactNativeGradlePluginPath = resolveNodePathUtf8("require.resolve('@react-native/gradle-plugin/package.json')")

  includeBuild(new File(reactNativeGradlePluginPath).getParentFile().toString())
  if(reactNativeMinor == 74 && reactNativePatch <= 3){
    includeBuild("react-settings-plugin")
  }
}

plugins { id("com.facebook.react.settings") }

def resolveNodePath(String expression) {
  def standardOutput = new ByteArrayOutputStream()
  def errorOutput = new ByteArrayOutputStream()
  def process = ["node", "--print", expression].execute(null, rootDir)
  process.waitForProcessOutput(standardOutput, errorOutput)

  if (process.exitValue() != 0) {
    throw new GradleException(errorOutput.toString("UTF-8").trim())
  }

  return standardOutput.toString("UTF-8").trim()
}

def reactNativePackagePath = resolveNodePath("require.resolve('react-native/package.json')")
def reactNativeGradlePluginFromRNPath = resolveNodePath("require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
def reactNativeCliAndroidPath = resolveNodePath("require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })")
def expoPackagePath = resolveNodePath("require.resolve('expo/package.json')")

def getRNMinorVersion() {
  def version = providers.exec {
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return minor
}

if (getRNMinorVersion() >= 75) {
  extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_UNSTABLE_CORE_AUTOLINKING') == '1') {
      println('\u001B[32mUsing expo-modules-autolinking as core autolinking source\u001B[0m')
      def command = [
        'node',
        '--no-warnings',
        '--eval',
        'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
        'react-native-config',
        '--json',
        '--platform',
        'android'
      ].toList()
      ex.autolinkLibrariesFromCommand(command)
    } else {
      ex.autolinkLibrariesFromCommand()
    }
  }
}

rootProject.name = 'AppAcompañamientoUV'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(reactNativePackagePath, "../gradle/libs.versions.toml")))
    }
  }
}

apply from: new File(expoPackagePath, "../scripts/autolinking.gradle");
useExpoModules()

if (getRNMinorVersion() < 75) {
  apply from: new File(reactNativeCliAndroidPath, "../native_modules.gradle");
  applyNativeModulesSettingsGradle(settings)
}

include ':app'
includeBuild(new File(reactNativeGradlePluginFromRNPath).getParentFile())
